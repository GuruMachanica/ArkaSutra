services:
  - type: web
    name: sunmap-unified
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health

  - type: web
    name: sunmap-frontend
    env: static
    buildCommand: npm --prefix Frontend install && npm --prefix Frontend run build
    staticPublishPath: ./Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  - type: web
    name: sunmap-backend
    env: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
