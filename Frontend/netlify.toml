[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://arkasutra-backend.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://arkasutra-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
