version: '3.8'

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: arkasutra-frontend
    restart: always
    ports:
      - "5175:80"
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - arkasutra-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: arkasutra-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    networks:
      - arkasutra-network

networks:
  arkasutra-network:
    driver: bridge
